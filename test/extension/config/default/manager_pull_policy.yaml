apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        # The e2e run builds the image from this tree and loads it straight into
        # the kind management cluster (test/e2e/config/e2e_conf.yaml images:
        # tryLoad) rather than pushing it to a registry, so it must not be
        # re-pulled. Matches config/default/capm3/manager_pull_policy_patch.yaml.
        imagePullPolicy: IfNotPresent

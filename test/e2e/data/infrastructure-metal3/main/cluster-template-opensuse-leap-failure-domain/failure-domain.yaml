---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE}
spec:
  # fd-3 is intentionally not declared: BMHs labeled fd-3 act as the fallback
  # target when a control plane machine requests a declared FD with no free host.
  failureDomains:
  - name: fd-1
    controlPlane: true
  - name: fd-2
    controlPlane: true

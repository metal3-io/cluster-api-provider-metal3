---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE}
spec:
  # Two declared failure domains for three control plane machines: the third
  # machine is assigned one of them and, because its dataTemplate is mapped to
  # that domain, waits until a host labeled with it becomes available instead
  # of falling back to any free host.
  failureDomains:
  - name: fd-1
    controlPlane: true
  - name: fd-2
    controlPlane: true
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3MachineTemplate
metadata:
  name: ${CLUSTER_NAME}-controlplane
  namespace: ${NAMESPACE}
spec:
  failureDomainDataTemplates:
  - failureDomain: fd-1
    dataTemplate:
      name: ${CLUSTER_NAME}-controlplane-template-fd-1
  - failureDomain: fd-2
    dataTemplate:
      name: ${CLUSTER_NAME}-controlplane-template-fd-2

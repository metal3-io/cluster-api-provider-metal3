---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE}
spec:
  # fd-3 is intentionally not declared: BMHs labeled fd-3 act as the fallback
  # target when a control plane machine requests a declared FD with no free host.
  failureDomains:
  - name: fd-1
    controlPlane: true
  - name: fd-2
    controlPlane: true
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3MachineTemplate
metadata:
  name: ${CLUSTER_NAME}-controlplane
  namespace: ${NAMESPACE}
spec:
  failureDomainDataTemplates:
  - failureDomain: fd-1
    dataTemplate:
      name: ${CLUSTER_NAME}-controlplane-template-fd-1
  - failureDomain: fd-2
    dataTemplate:
      name: ${CLUSTER_NAME}-controlplane-template-fd-2

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../../../../config/default

# The CAPM3 image is injected at e2e runtime by scripts/ci-e2e.sh
# (kustomize edit set image -> ${REGISTRY}/localimages/cluster-api-provider-metal3:e2e),
# so the run tests the code in this tree. Standalone kustomize build keeps the
# config/default :main image.
patches:
- patch: |
    # Extend default with TLS 1.3 hardening.
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: "--tls-min-version=VersionTLS13"
  target:
    kind: Deployment
    name: controller-manager
